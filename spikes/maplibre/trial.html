<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SDA MapLibre Trial</title>
  <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 420px; }
    #fallback { padding: 1rem; }
    #fallback li { margin-block: 0.75rem; }
    #fallback .citations { display: block; margin-block-start: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="map-heading">
      <h1 id="map-heading">Saudi Defense Atlas public map trial</h1>
      <div id="map" aria-label="Interactive public fixed-facility map"></div>
    </section>
    <section aria-labelledby="fallback-heading">
      <h2 id="fallback-heading">Map data</h2>
      <ul id="fallback"></ul>
    </section>
  </main>
  <script type="module">
    import maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';

    const payload = await fetch('/trial-data.json').then((response) => {
      if (!response.ok) throw new Error(`trial-data fetch failed: ${response.status}`);
      return response.json();
    });

    const fallback = document.querySelector('#fallback');
    for (const item of payload.fallback_items) {
      const li = document.createElement('li');
      li.dataset.featureId = item.feature_id;
      const ar = item.names.ar || '';
      const en = item.names.en || '';
      const locationAr = item.location_label?.ar || '';
      const locationEn = item.location_label?.en || '';
      const label = document.createElement('span');
      label.textContent = `${ar} — ${en} — ${locationAr} — ${locationEn}`;
      li.append(label);

      const citations = document.createElement('span');
      citations.className = 'citations';
      citations.dataset.citationCount = String(item.citations.length);
      citations.append(document.createTextNode('Evidence: '));
      item.citations.forEach((citation, index) => {
        if (index > 0) citations.append(document.createTextNode(', '));
        const anchor = document.createElement('a');
        anchor.dataset.evidenceId = citation.evidence_id;
        anchor.dataset.documentId = citation.document_id;
        anchor.dataset.sourceId = citation.source_id;
        anchor.textContent = citation.evidence_id;
        if (citation.url) anchor.href = citation.url;
        citations.append(anchor);
      });
      li.append(citations);
      fallback.append(li);
    }

    const style = {
      version: 8,
      sources: {},
      layers: [
        {
          id: 'background',
          type: 'background',
          paint: { 'background-color': '#f5f5f5' }
        }
      ]
    };

    const first = payload.geojson.features[0];
    const initialCenter = first ? first.geometry.coordinates : [45, 24];
    const map = new maplibregl.Map({
      container: 'map',
      style,
      center: initialCenter,
      zoom: 5,
      attributionControl: false,
      interactive: true
    });

    map.on('load', () => {
      map.addSource('sda-public-facilities', {
        type: 'geojson',
        data: payload.geojson
      });
      map.addLayer({
        id: 'sda-public-facilities',
        type: 'circle',
        source: 'sda-public-facilities',
        paint: {
          'circle-radius': 8,
          'circle-stroke-width': 2
        }
      });

      if (payload.geojson.features.length > 1) {
        const bounds = new maplibregl.LngLatBounds();
        for (const feature of payload.geojson.features) {
          bounds.extend(feature.geometry.coordinates);
        }
        map.fitBounds(bounds, { padding: 48, duration: 0 });
      }

      map.once('idle', () => {
        window.__SDA_MAP_RESULT__ = {
          rendererContract: payload.renderer_contract,
          featureCount: payload.geojson.features.length,
          renderedFeatureCount: map.queryRenderedFeatures({ layers: ['sda-public-facilities'] }).length,
          styleSourceIds: Object.keys(map.getStyle().sources),
          styleLayerIds: map.getStyle().layers.map((layer) => layer.id),
          canvasPresent: Boolean(map.getCanvas()),
          fallbackCount: fallback.querySelectorAll('li').length
        };
        window.__SDA_MAP_READY__ = true;
      });
    });

    map.on('error', (event) => {
      window.__SDA_MAP_ERROR__ = String(event.error || event);
    });
  </script>
</body>
</html>

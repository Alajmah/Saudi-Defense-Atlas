name: Temporary PR26 feed identity hardening

on:
  push:
    branches:
      - m4/editorial-audit-brief

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/editorial-audit-brief
          fetch-depth: 0

      - name: Harden semantic feed action identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/intelligence/editorial_audit.py')
          text = service.read_text()
          old = '''        action_key = (str(kind), subject_id)\n        if kind == "source_monitoring_required":\n            action_key = (str(kind), subject_id, str(context["feed_key"]))\n'''
          new = '''        action_key = (str(kind), subject_id)\n        if kind == "source_monitoring_required":\n            # Registered feed_key is globally unique in the upstream M2 contract.\n            action_key = (str(kind), str(context["feed_key"]))\n'''
          if text.count(old) != 1:
              raise SystemExit('source action-key replacement target mismatch')
          service.write_text(text.replace(old, new, 1))

          validator = Path('scripts/validate_m4_editorial_audit_brief.py')
          text = validator.read_text()
          anchor = '''    source_deadline_not_after_observation = copy.deepcopy(report)\n'''
          insertion = '''    duplicate_feed_identity = copy.deepcopy(report)\n    original_feed_action = next(\n        item for item in duplicate_feed_identity["findings"]\n        if item["kind"] == "source_monitoring_required"\n    )\n    duplicate_feed_action = copy.deepcopy(original_feed_action)\n    duplicate_feed_action["subject_id"] = "SDA-SOURCE-DUPLICATE-FEED-OWNER"\n    duplicate_feed_action["context"]["source_id"] = (\n        "SDA-SOURCE-DUPLICATE-FEED-OWNER"\n    )\n    duplicate_feed_identity["findings"].append(duplicate_feed_action)\n    duplicate_feed_identity["summary"]["total"] += 1\n    duplicate_feed_identity["summary"][duplicate_feed_action["priority"]] += 1\n    duplicate_feed_identity["summary"]["source_monitoring_required"] += 1\n    _rehash_report(duplicate_feed_identity)\n    expect_raises(\n        "self-consistent duplicate registered feed under another Source",\n        lambda: build_daily_editorial_brief(audit_report=duplicate_feed_identity),\n        failures,\n    )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('feed identity validator insertion anchor mismatch')
          validator.write_text(text.replace(anchor, insertion + anchor, 1))

          review = Path('docs/reviews/M4_EDITORIAL_AUDIT_BRIEF_FIRST_PASS.md')
          text = review.read_text()
          old = '''**OUR VERIFICATION:** CONFIRMED and generalized. The invariant is semantic action uniqueness, not merely canonical reason ordering. Claim-review actions are unique per Claim ID; queue actions are unique per queue-item ID; source-monitoring actions are unique per Source + registered `feed_key`, preserving the intentional ability for one Source to expose multiple independent feeds.\n\n**RESULT:** CONFIRMED and remediated. The semantic brief boundary now tracks action keys after kind-specific context validation and rejects duplicate semantic actions even when content-addressed finding IDs differ. A self-consistent re-hashed fixture duplicates one source-monitoring action with reversed `reason_codes`, updates its summary consistently, proves the content IDs differ, and must still fail closed.\n'''
          new = '''**OUR VERIFICATION:** CONFIRMED and generalized. The invariant is semantic action uniqueness, not merely canonical reason ordering. Claim-review actions are unique per Claim ID; queue actions are unique per queue-item ID; source-monitoring actions are unique per registered `feed_key`. The upstream M2 source-freshness contract makes `feed_key` globally unique while still allowing one Source to own multiple distinct feeds.\n\n**OUR EXTENSION:** the initial generalized key was Source + `feed_key`. A second adversarial pass found that this would still admit the same globally unique registered feed under two different Source IDs. The source-monitoring semantic key was therefore tightened to `feed_key` itself, with Source identity remaining validated context/provenance.\n\n**RESULT:** CONFIRMED and remediated. The semantic brief boundary now tracks action keys after kind-specific context validation and rejects duplicate semantic actions even when content-addressed finding IDs differ. One self-consistent re-hashed fixture duplicates a source-monitoring action with reversed `reason_codes`; another assigns the same registered `feed_key` to a different canonical Source. Both must fail closed.\n'''
          if text.count(old) != 1:
              raise SystemExit('review feed identity replacement target mismatch')
          review.write_text(text.replace(old, new, 1))
          PY

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/intelligence/editorial_audit.py scripts/validate_m4_editorial_audit_brief.py docs/reviews/M4_EDITORIAL_AUDIT_BRIEF_FIRST_PASS.md
          git diff --cached --check
          git commit -m "fix: enforce global registered feed action identity"
          git push origin HEAD:m4/editorial-audit-brief

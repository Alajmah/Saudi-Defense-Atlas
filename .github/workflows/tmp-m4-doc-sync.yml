name: Temporary M4 documentation sync

on:
  push:
    branches:
      - docs/m4-roadmap-sync

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m4-roadmap-sync
          fetch-depth: 0
      - name: Apply documentation sync
        run: python scripts/tmp_sync_m4_docs.py
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md README.md
          git diff --cached --check
          git commit -m "docs: synchronize roadmap with merged M4 controls"
          git push origin HEAD:docs/m4-roadmap-sync

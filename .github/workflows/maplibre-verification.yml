name: maplibre-verification

on:
  pull_request:
    paths:
      - "spikes/maplibre/**"
      - "services/presentation/map_geojson.py"
      - "services/presentation/public_map.py"
      - "schemas/v0.1/public-map-view.schema.json"
      - "scripts/emit_m3_maplibre_fixture.py"
      - "scripts/validate_m3_map_renderer_payload.py"
      - "docs/adr/ADR-0005-public-map-renderer-trial.md"
      - "architecture/**"
      - ".github/workflows/maplibre-verification.yml"
  push:
    branches:
      - main
      - "m3/**"
    paths:
      - "spikes/maplibre/**"
      - "services/presentation/map_geojson.py"
      - "services/presentation/public_map.py"
      - "schemas/v0.1/public-map-view.schema.json"
      - "scripts/emit_m3_maplibre_fixture.py"
      - "scripts/validate_m3_map_renderer_payload.py"
      - "docs/adr/ADR-0005-public-map-renderer-trial.md"
      - "architecture/**"
      - ".github/workflows/maplibre-verification.yml"

permissions:
  contents: read

jobs:
  verify-maplibre:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate renderer payload adapter
        run: python scripts/validate_m3_map_renderer_payload.py

      - name: Emit PublicMapView-derived trial payload
        run: python scripts/emit_m3_maplibre_fixture.py spikes/maplibre/trial-data.json

      - name: Install pinned trial dependencies
        working-directory: spikes/maplibre
        run: npm install --no-package-lock --ignore-scripts

      - name: Install Chromium for browser trial
        working-directory: spikes/maplibre
        run: npx playwright install --with-deps chromium

      - name: Run provider-independent MapLibre browser trial
        working-directory: spikes/maplibre
        run: node run_trial.mjs | tee maplibre-trial-evidence.json

      - name: Upload trial evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-maplibre-trial-evidence
          path: spikes/maplibre/maplibre-trial-evidence.json
          if-no-files-found: error

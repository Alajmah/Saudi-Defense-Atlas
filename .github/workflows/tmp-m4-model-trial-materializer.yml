name: Temporary M4 model-trial materializer

on:
  push:
    branches:
      - m4/model-extraction-trial

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/model-extraction-trial
          fetch-depth: 0
      - name: Materialize bounded model trial
        env:
          PAYLOAD_B64: "[... ELLIPSIZATION ...]"
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/m4trial.tgz
          tar -xzf /tmp/m4trial.tgz -C .
          python - <<'PY2'
          from pathlib import Path
          path = Path('.github/workflows/schema-validation.yml')
          text = path.read_text()
          needle = '      - name: Validate M4 typed AI extraction boundary\n        run: python scripts/validate_m4_ai_extraction_boundary.py\n'
          insertion = needle + '\n      - name: Validate M4 bounded model extraction trial harness\n        run: python scripts/validate_m4_model_extraction_trial.py\n'
          if 'Validate M4 bounded model extraction trial harness' not in text:
              if needle not in text:
                  raise SystemExit('schema-validation insertion anchor not found')
              text = text.replace(needle, insertion, 1)
              path.write_text(text)
          PY2
          python -m py_compile services/intelligence/model_extraction_trial.py scripts/validate_m4_model_extraction_trial.py scripts/run_m4_model_extraction_trial.py
          python -m json.tool tests/fixtures/m4-model-extraction-eval.json >/dev/null
      - name: Commit materialized trial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/intelligence/model_extraction_trial.py scripts/validate_m4_model_extraction_trial.py scripts/run_m4_model_extraction_trial.py tests/fixtures/m4-model-extraction-eval.json docs/M4_MODEL_EXTRACTION_TRIAL.md .github/workflows/m4-model-extraction-trial.yml .github/workflows/schema-validation.yml
          git commit -m 'M4: add bounded real-model extraction trial' || exit 0
          git push origin HEAD:m4/model-extraction-trial

name: Temporary PR26 semantic action dedupe remediation

on:
  push:
    branches:
      - m4/editorial-audit-brief

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/editorial-audit-brief
          fetch-depth: 0

      - name: Apply exact-head semantic action dedupe remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/intelligence/editorial_audit.py')
          text = service.read_text()
          old = '''    findings: list[Mapping[str, Any]] = []\n    seen_ids: set[str] = set()\n    for finding in findings_raw:\n'''
          new = '''    findings: list[Mapping[str, Any]] = []\n    seen_ids: set[str] = set()\n    seen_action_keys: set[tuple[str, ...]] = set()\n    for finding in findings_raw:\n'''
          if text.count(old) != 1:
              raise SystemExit('seen-action insertion target mismatch')
          text = text.replace(old, new, 1)

          old = '''        _validate_finding_context(\n            kind=str(kind),\n            subject_id=subject_id,\n            priority=str(priority),\n            reasons=reasons,\n            context=context,\n            as_of_dt=as_of_dt,\n        )\n        body = {key: value for key, value in finding.items() if key != "id"}\n'''
          new = '''        _validate_finding_context(\n            kind=str(kind),\n            subject_id=subject_id,\n            priority=str(priority),\n            reasons=reasons,\n            context=context,\n            as_of_dt=as_of_dt,\n        )\n        action_key = (str(kind), subject_id)\n        if kind == "source_monitoring_required":\n            action_key = (str(kind), subject_id, str(context["feed_key"]))\n        if action_key in seen_action_keys:\n            raise EditorialAuditError("audit findings contain a duplicate semantic action")\n        seen_action_keys.add(action_key)\n        body = {key: value for key, value in finding.items() if key != "id"}\n'''
          if text.count(old) != 1:
              raise SystemExit('semantic action validation target mismatch')
          service.write_text(text.replace(old, new, 1))

          validator = Path('scripts/validate_m4_editorial_audit_brief.py')
          text = validator.read_text()
          anchor = '''    source_deadline_not_after_observation = copy.deepcopy(report)\n'''
          insertion = '''    duplicate_semantic_action = copy.deepcopy(report)\n    original_source_action = next(\n        item for item in duplicate_semantic_action["findings"]\n        if item["kind"] == "source_monitoring_required"\n        and len(item["reason_codes"]) > 1\n    )\n    duplicate_source_action = copy.deepcopy(original_source_action)\n    duplicate_source_action["reason_codes"] = list(\n        reversed(duplicate_source_action["reason_codes"])\n    )\n    duplicate_semantic_action["findings"].append(duplicate_source_action)\n    duplicate_semantic_action["summary"]["total"] += 1\n    duplicate_semantic_action["summary"][duplicate_source_action["priority"]] += 1\n    duplicate_semantic_action["summary"]["source_monitoring_required"] += 1\n    _rehash_report(duplicate_semantic_action)\n    expect(\n        duplicate_source_action["id"] != original_source_action["id"],\n        "duplicate semantic-action fixture must use distinct content IDs",\n        failures,\n    )\n    expect_raises(\n        "self-consistent duplicate semantic source-monitoring action",\n        lambda: build_daily_editorial_brief(audit_report=duplicate_semantic_action),\n        failures,\n    )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('validator insertion anchor mismatch')
          validator.write_text(text.replace(anchor, insertion + anchor, 1))

          review = Path('docs/reviews/M4_EDITORIAL_AUDIT_BRIEF_FIRST_PASS.md')
          text = review.read_text()
          anchor = '''## Final bounded assessment\n'''
          insertion = '''## Codex independent second review — pass 5\n\nCodex reviewed head `180dd015de64e0be9eff894816ad99e4d3eba08f` and reported one additional P2 semantic-integrity finding: two otherwise equivalent actions could receive distinct finding IDs when `reason_codes` order differed, allowing duplicate editor actions and inflated summary counts.\n\n### Reconciliation\n\n**CODEX CLAIM:** content-ID uniqueness alone is insufficient because array-order variants can encode the same editorial action under different hashes.\n\n**OUR VERIFICATION:** CONFIRMED and generalized. The invariant is semantic action uniqueness, not merely canonical reason ordering. Claim-review actions are unique per Claim ID; queue actions are unique per queue-item ID; source-monitoring actions are unique per Source + registered `feed_key`, preserving the intentional ability for one Source to expose multiple independent feeds.\n\n**RESULT:** CONFIRMED and remediated. The semantic brief boundary now tracks action keys after kind-specific context validation and rejects duplicate semantic actions even when content-addressed finding IDs differ. A self-consistent re-hashed fixture duplicates one source-monitoring action with reversed `reason_codes`, updates its summary consistently, proves the content IDs differ, and must still fail closed.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('review insertion anchor mismatch')
          review.write_text(text.replace(anchor, insertion + anchor, 1))
          PY

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/intelligence/editorial_audit.py scripts/validate_m4_editorial_audit_brief.py docs/reviews/M4_EDITORIAL_AUDIT_BRIEF_FIRST_PASS.md
          git diff --cached --check
          git commit -m "fix: reject duplicate semantic audit actions"
          git push origin HEAD:m4/editorial-audit-brief

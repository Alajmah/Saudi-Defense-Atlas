name: schema-validation

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "m1/**"
      - "m2/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas and fixtures
        run: python scripts/validate_schemas.py

      - name: Validate mutation governance
        run: python scripts/validate_workflow.py

      - name: Validate M1 deterministic ingestion
        run: python scripts/validate_m1_ingestion.py

      - name: Validate M1 typed proposal generation
        run: python scripts/validate_m1_proposal.py

      - name: Validate M1 mutation reconciliation
        run: python scripts/validate_m1_mutation_guard.py

      - name: Validate M1 project Revision construction
        run: python scripts/validate_m1_revision.py

      - name: Validate M1 public equipment read model
        run: python scripts/validate_m1_equipment_view.py

      - name: Validate M1 public projection guards
        run: python scripts/validate_m1_public_projection_guards.py

      - name: Validate M1 public API and bilingual pages
        run: python scripts/validate_m1_public_web.py

      - name: Validate M2 bounded relationship graph
        run: python scripts/validate_m2_relationship_graph.py

      - name: Validate M2 graph isolation and event intervals
        run: python scripts/validate_m2_relationship_graph_isolation.py

      - name: Validate M2 claim staleness policy
        run: python scripts/validate_m2_staleness.py

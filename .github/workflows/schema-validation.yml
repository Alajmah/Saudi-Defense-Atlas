name: schema-validation

on:
  pull_request:
  push:
    branches:
      - main
      - "bootstrap/**"
      - "m1/**"
      - "m2/**"
      - "m3/**"
      - "m4/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas and fixtures
        run: python scripts/validate_schemas.py

      - name: Validate mutation governance
        run: python scripts/validate_workflow.py

      - name: Validate M1 deterministic ingestion
        run: python scripts/validate_m1_ingestion.py

      - name: Validate M1 typed proposal generation
        run: python scripts/validate_m1_proposal.py

      - name: Validate M1 mutation reconciliation
        run: python scripts/validate_m1_mutation_guard.py

      - name: Validate M1 project Revision construction
        run: python scripts/validate_m1_revision.py

      - name: Validate M1 public equipment read model
        run: python scripts/validate_m1_equipment_view.py

      - name: Validate M1 public projection guards
        run: python scripts/validate_m1_public_projection_guards.py

      - name: Validate M1 public API and bilingual pages
        run: python scripts/validate_m1_public_web.py

      - name: Validate M2 bounded relationship graph
        run: python scripts/validate_m2_relationship_graph.py

      - name: Validate M2 graph isolation and event intervals
        run: python scripts/validate_m2_relationship_graph_isolation.py

      - name: Validate M2 claim staleness policy
        run: python scripts/validate_m2_staleness.py

      - name: Validate M2 staleness input integrity
        run: python scripts/validate_m2_staleness_isolation.py

      - name: Validate M2 procurement and exercise domain views
        run: python scripts/validate_m2_domain_views.py

      - name: Validate M2 source acquisition freshness
        run: python scripts/validate_m2_source_freshness.py

      - name: Validate M2 first relationship visualization
        run: python scripts/validate_m2_relationship_visualization.py

      - name: Validate M3 Arabic-aware search contract
        run: python scripts/validate_m3_search_contract.py

      - name: Validate M3 search contract isolation
        run: python scripts/validate_m3_search_contract_isolation.py

      - name: Validate M3 public non-operational map contract
        run: python scripts/validate_m3_public_map.py

      - name: Validate M3 public map cross-record isolation
        run: python scripts/validate_m3_public_map_isolation.py

      - name: Validate M3 public map post-merge hardening
        run: python scripts/validate_m3_public_map_hardening.py

      - name: Validate M3 map renderer payload adapter
        run: python scripts/validate_m3_map_renderer_payload.py

      - name: Validate M3 timeline and filter navigation
        run: python scripts/validate_m3_navigation.py

      - name: Validate M4 deterministic monitoring and editorial routing
        run: python scripts/validate_m4_editorial_routing.py

      - name: Validate M4 editorial routing isolation
        run: python scripts/validate_m4_editorial_routing_isolation.py

      - name: Validate M4 typed AI extraction boundary
        run: python scripts/validate_m4_ai_extraction_boundary.py

      - name: Validate M4 bounded model extraction trial harness
        run: python scripts/validate_m4_model_extraction_trial.py

      - name: Validate M4 model extraction trial Codex reconciliation
        run: python scripts/validate_m4_model_extraction_trial_reconciliation.py

      - name: Validate M4 model extraction trial fallback second review
        run: python scripts/validate_m4_model_extraction_trial_fallback_review.py

      - name: Validate M4 Z.ai trial provider edge
        run: python scripts/validate_m4_model_extraction_trial_zai_provider.py

      - name: Validate M4 resolver verifier boundary
        run: python scripts/validate_m4_resolver_verifier.py

      - name: Validate M4 resolver verifier isolation
        run: python scripts/validate_m4_resolver_verifier_isolation.py

      - name: Validate M4 editorial review packet
        run: python scripts/validate_m4_editorial_review_packet.py

      - name: Validate M4 editorial review packet isolation
        run: python scripts/validate_m4_editorial_review_packet_isolation.py

      - name: Validate M4 editorial decision binding
        run: python scripts/validate_m4_editorial_decision_binding.py

      - name: Validate M4 multi-source editorial vertical slice
        run: python scripts/validate_m4_multi_source_vertical_slice.py

      - name: Validate M4 canonical mutation dispatcher
        run: python scripts/validate_m4_canonical_mutation_dispatcher.py

      - name: Validate M4 editorial audit and daily brief
        run: python scripts/validate_m4_editorial_audit_brief.py
